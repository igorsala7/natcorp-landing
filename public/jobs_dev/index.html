<!--
  REDIRECIONADOR DO QUADRO DE VAGAS — homologação.

  Gêmeo de /jobs/, com UMA diferença: o destino é sempre a instância de testes
  (/apex/dev), para qualquer cliente. Por isso não há a escolha por empresa que
  a versão de produção faz — o `company` aqui só entra no nome do quadro
  (QUADRO_VAGAS_<company>), não no caminho.

  Na versão antiga essa escolha existia comentada logo acima da atribuição
  final. Foi removida: código comentado num arquivo de produção é armadilha,
  porque parece que decide algo e não decide.

  As mesmas duas correções de /jobs/ valem aqui — a tag do CryptoJS
  (googlecode morto, 404, bloqueante e sem uso) saiu, e o <head> agora fecha.
  A regra de montagem da URL não mudou.
-->

<!--
  MEDIÇÃO NESTE REDIRECIONADOR — decisão do dono em 16/09/2026.

  Aqui as tags disparam SEM barra de consentimento, ao contrário do resto do
  site. O candidato chega de um anúncio direto nesta URL e sai em seguida: não
  há página onde perguntar. A política de cookies e os termos de uso foram
  reescritos no mesmo commit para descrever exatamente isto — site que promete
  uma coisa e faz outra é prova documental contra a própria empresa.

  O PROBLEMA DE TEMPO, que é o que decide se a medição existe: esta página salta
  para o APEX em milissegundos. Disparar a tag e redirecionar em seguida não
  mede nada — o script nem termina de carregar. Por isso o redirecionamento
  espera, com TETO de 600 ms: sai quando as duas tags acusarem envio, ou quando
  o teto vencer, o que vier primeiro. O candidato paga no máximo seis décimos.

  O Pixel vai por IMAGEM (o beacon oficial `tr?...&noscript=1`), não por
  biblioteca: imagem dispara na hora, sem esperar script, que é o que esta
  página precisa. O GA4 não tem equivalente e vai pelo gtag mesmo, com
  `transport_type: beacon` para sobreviver à navegação.
-->
<script>
  (function () {
    var GA4 = 'G-BBE99E2LWM'
    var PIXEL = '856605322636853'
    var TETO_MS = 600

    window.__natcorpMedir = function (parametros, seguir) {
      var saiu = false
      var faltam = 2
      function sair() {
        if (saiu) return
        saiu = true
        seguir()
      }
      function pronto() {
        if (--faltam <= 0) sair()
      }
      setTimeout(sair, TETO_MS)

      /* Meta: beacon por imagem, dispara imediatamente. */
      var img = new Image()
      img.onload = img.onerror = pronto
      img.src = 'https://www.facebook.com/tr?id=' + PIXEL + '&ev=PageView&noscript=1'

      /* GA4 */
      window.dataLayer = window.dataLayer || []
      function gtag() { window.dataLayer.push(arguments) }
      var s = document.createElement('script')
      s.async = true
      s.onerror = pronto
      s.onload = function () {
        gtag('js', new Date())
        gtag('config', GA4, { transport_type: 'beacon' })
        gtag('event', 'clique_vaga', parametros)
        /* Um respiro para o gtag montar e despachar a requisição. */
        setTimeout(pronto, 120)
      }
      s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA4
      document.head.appendChild(s)
    }
  })()
</script>
</head>

<body>
<script>
  function queryString(parameter) {
    var loc = location.search.substring(1, location.search.length)
    var param_value = false
    var params = loc.split('&')
    for (var i = 0; i < params.length; i++) {
      var param_name = params[i].substring(0, params[i].indexOf('='))
      if (param_name == parameter) {
        param_value = params[i].substring(params[i].indexOf('=') + 1)
      }
    }
    return param_value !== false ? param_value : undefined
  }

  var company = queryString('company')
  var id = queryString('id')
  var board = queryString('board')

  /* Homologação: uma instância só, para todo cliente. */
  var url_base = 'https://www.natcorpbr.com.br/apex/dev'

  var url
  if (company && id && board) {
    url = url_base + '/f?p=QUADRO_VAGAS_' + company + ':3::::3:P_ID,P3_COD:' + board + ',' + id
  } else if (company && board) {
    url = url_base + '/f?p=QUADRO_VAGAS_' + company + ':1::::1:P_ID:' + board
  } else {
    console.error('Parâmetros ausentes.')
    url = 'https://www.natcorp.com.br'
  }

  /* replace() e não href: o redirecionador não fica no histórico, então o
     "voltar" do navegador leva o candidato de onde ele veio, e não para cá —
     que o mandaria de volta para a vaga num laço.

     Passa pela medição antes: ela dispara as tags e chama de volta quando
     terminarem, ou quando o teto de tempo vencer. Os parâmetros da vaga vão
     junto — sem eles o relatório diria só "alguém clicou em alguma vaga". */
  window.__natcorpMedir(
    { empresa: company || '(sem empresa)', quadro: board || '(sem quadro)', vaga: id || '(quadro inteiro)' },
    function () {
      window.location.replace(url)
    },
  )
</script>
</body>

</html>
